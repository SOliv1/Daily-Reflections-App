language: node_js
node_js:
  - "20"

cache:
  npm: true
  directories:
    - ~/.npm

install:
  - npm ci

script:
  - npm test -- --watchAll=false App.test.js
  - npm run build

deploy:
  provider: pages:git
  edge: true
  token: "$GITHUB_TOKEN"
  local_dir: build
  target_branch: gh-pages
  keep_history: true
  cleanup: false
  on:
    branch: master
